[project]
name = "bidlens"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "AI estimating copilot for heavy civil bids, built on public Caltrans bid data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
